<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SVR Mod Workshop</title>
<style>
:root{--bg:#11151c;--panel:#192030;--line:#2b3547;--ink:#ebe7df;--mute:#8e9bb0;--acc:#e5473d;--ok:#5fb88a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9edf3;--panel:#fff;--line:#cdd5e1;--ink:#161b26;--mute:#5b6779;--acc:#c9302a;--ok:#1f7a4d;color-scheme:light}}
:root[data-theme="light"]{--bg:#e9edf3;--panel:#fff;--line:#cdd5e1;--ink:#161b26;--mute:#5b6779;--acc:#c9302a;--ok:#1f7a4d;color-scheme:light}
:root[data-theme="dark"]{--bg:#11151c;--panel:#192030;--line:#2b3547;--ink:#ebe7df;--mute:#8e9bb0;--acc:#e5473d;--ok:#5fb88a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:22px 20px 0;max-width:1500px;margin:0 auto}
h1{font:800 clamp(28px,6vw,44px)/1 Bahnschrift,"Arial Narrow","Roboto Condensed",system-ui,sans-serif;letter-spacing:-.01em;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 18px}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--line)}
.tabs button{background:none;border:0;color:var(--mute);font:600 16px system-ui;padding:11px 18px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--acc)}
main{max-width:1500px;margin:0 auto;padding:18px 20px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
h2{font:700 18px Bahnschrift,"Arial Narrow",system-ui,sans-serif;margin:0 0 10px}
.note{color:var(--mute);font-size:13px;margin:6px 0 0}
.btn,button.b{display:inline-block;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 12px;font:600 13px system-ui;cursor:pointer}
.btn:hover,button.b:hover{border-color:var(--acc)}.pri{background:var(--acc)!important;border-color:var(--acc)!important;color:#fff!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.mf label{display:grid;gap:3px;font-size:12px;color:var(--mute)}
input[type=text],select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 8px;font:14px system-ui;width:100%}

audio{width:100%;max-width:420px;height:34px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:5px 8px;border-top:1px solid var(--line)}

.big{display:block;text-align:center;border:2px dashed var(--line);border-radius:6px;padding:34px 16px;cursor:pointer;margin-bottom:16px}
.big:hover{border-color:var(--acc)}.big b{font-size:18px;display:block}

@media(max-width:560px){.row{grid-template-columns:1fr}.act{justify-content:flex-start}}
</style></head><body>
<header><h1>SVR Mod Workshop</h1><p class="sub">Open, edit and build .svrmod packs. Everything runs in your browser; no files are uploaded.</p>
<div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-t="edit">Edit a mod</button><button role="tab" aria-selected="false" data-t="create">Create a mod</button><button role="tab" aria-selected="false" data-t="studio">PAC Studio (3D)</button></div></header>
<main><section id="edit"></section><section id="create" class="hide"></section><section id="studio" class="hide"><iframe id="sf" title="PAC Studio" style="width:100%;height:calc(100vh - 120px);min-height:560px;border:0"></iframe></section></main><div id="toast" role="status"></div>
<script>
const $=(r,s)=>r.querySelector(s),td=new TextDecoder(),te=new TextEncoder();
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',6000)}
const fmt=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':n>=1024?(n/1024).toFixed(1)+' KB':n+' B';
/* ---------- save (hosted-safe) ---------- */
async function save(name,blob){
 if(!blob.type)blob=new Blob([blob],{type:'application/octet-stream'});
 try{const dl=window.claude&&await window.claude.use('downloads');
  if(dl){try{await dl.save({filename:name,data:blob});return}catch(e){
   if(e.code==='declined')return;
   if(e.code==='rejected_extension'){await dl.save({filename:name+'.zip',data:blob});toast('Saved as '+name+'.zip. Delete the ".zip" to use it.');return}
   throw e}}
 }catch(e){toast('Save failed: '+(e.message||e.code));return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),9e3)}
/* ---------- zip ---------- */
const crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=-1;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0}
async function readZip(file){
 const tl=new DataView(await file.slice(Math.max(0,file.size-65557)).arrayBuffer());let p=tl.byteLength-22;
 while(p>=0&&tl.getUint32(p,true)!==0x06054b50)p--;if(p<0)throw Error('Not a ZIP-based .svrmod file');
 const n=tl.getUint16(p+10,true),cs=tl.getUint32(p+12,true),co=tl.getUint32(p+16,true);
 const cd=new DataView(await file.slice(co,co+cs).arrayBuffer());let o=0;const out=[];
 for(let i=0;i<n;i++){const m=cd.getUint16(o+10,true),crc=cd.getUint32(o+16,true),c=cd.getUint32(o+20,true),nl=cd.getUint16(o+28,true),el=cd.getUint16(o+30,true),cl=cd.getUint16(o+32,true),lo=cd.getUint32(o+42,true);
  const name=td.decode(new Uint8Array(cd.buffer,o+46,nl));o+=46+nl+el+cl;if(name.endsWith('/'))continue;
  const lh=new DataView(await file.slice(lo,lo+30).arrayBuffer()),st=lo+30+lh.getUint16(26,true)+lh.getUint16(28,true);
  let blob=file.slice(st,st+c),cr=crc;
  if(m===8){blob=await new Response(blob.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob();cr=null}else if(m!==0)throw Error('Unsupported zip method in '+name);
  out.push({name,blob,crc:cr})}
 return out}
async function writeZip(list){
 const parts=[],cd=[];let off=0;
 for(const f of list){const nb=te.encode(f.name);if(f.crc==null)f.crc=crc32(new Uint8Array(await f.blob.arrayBuffer()));
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(12,0x21,true);h.setUint32(14,f.crc,true);h.setUint32(18,f.blob.size,true);h.setUint32(22,f.blob.size,true);h.setUint16(26,nb.length,true);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x800,true);c.setUint16(14,0x21,true);c.setUint32(16,f.crc,true);c.setUint32(20,f.blob.size,true);c.setUint32(24,f.blob.size,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
  parts.push(h.buffer,nb,f.blob);cd.push(c.buffer,nb);off+=30+nb.length+f.blob.size}
 const cdl=cd.reduce((a,b)=>a+(b.byteLength??b.length),0),e=new DataView(new ArrayBuffer(22));
 e.setUint32(0,0x06054b50,true);e.setUint16(8,list.length,true);e.setUint16(10,list.length,true);e.setUint32(12,cdl,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cd,e.buffer])}
/* ---------- DDS ---------- */
const c565=c=>[(c>>11&31)*255/31,(c>>5&63)*255/63,(c&31)*255/31];
function decDDS(buf){
 const v=new DataView(buf);if(v.getUint32(0,true)!==0x20534444)throw Error('Not a DDS file');
 const h=v.getUint32(12,true),w=v.getUint32(16,true),pf=v.getUint32(80,true),cc=td.decode(new Uint8Array(buf,84,4)),bpp=v.getUint32(88,true),out=new Uint8ClampedArray(w*h*4);
 if(pf&4){const t={DXT1:1,DXT3:3,DXT5:5}[cc];if(!t)throw Error('Unsupported DDS format '+cc+' (supports DXT1/3/5 and 24/32-bit)');
  const bs=t===1?8:16;let o=128;
  for(let by=0;by<h;by+=4)for(let bx=0;bx<w;bx+=4,o+=bs){
   const co=o+(t===1?0:8),a0=v.getUint16(co,true),a1=v.getUint16(co+2,true),bits=v.getUint32(co+4,true),C0=c565(a0),C1=c565(a1);let P;
   if(t===1&&a0<=a1)P=[C0,C1,C0.map((x,i)=>(x+C1[i])/2),null];else P=[C0,C1,C0.map((x,i)=>(2*x+C1[i])/3),C0.map((x,i)=>(x+2*C1[i])/3)];
   const A=new Array(16).fill(255);
   if(t===3){for(let r=0;r<4;r++){const q=v.getUint16(o+r*2,true);for(let i=0;i<4;i++)A[r*4+i]=(q>>(i*4)&15)*17}}
   else if(t===5){const e0=v.getUint8(o),e1=v.getUint8(o+1),lo=v.getUint32(o+2,true),hi=v.getUint16(o+6,true),pal=[e0,e1];
    if(e0>e1)for(let k=1;k<7;k++)pal.push(((7-k)*e0+k*e1)/7);else{for(let k=1;k<5;k++)pal.push(((5-k)*e0+k*e1)/5);pal.push(0,255)}
    for(let i=0;i<16;i++){const s=3*i;A[i]=pal[(s+3<=32?lo>>>s:s>=32?hi>>>(s-32):(lo>>>s)|(hi<<(32-s)))&7]}}
   for(let i=0;i<16;i++){const x=bx+(i&3),y=by+(i>>2);if(x>=w||y>=h)continue;const q=P[bits>>>(2*i)&3],d=(y*w+x)*4;
    if(q){out[d]=q[0];out[d+1]=q[1];out[d+2]=q[2];out[d+3]=A[i]}else out[d+3]=0}}
 }else if(bpp===32||bpp===24){const B=bpp/8,m=[92,96,100,104].map(k=>v.getUint32(k,true)),sh=m.map(k=>k?31-Math.clz32(k&-k):0),mx=m.map((k,i)=>k?k/(1<<sh[i]):0);
  for(let i=0;i<w*h;i++){const o=128+i*B;let px=v.getUint8(o)|v.getUint8(o+1)<<8|v.getUint8(o+2)<<16|(B>3?v.getUint8(o+3)<<24:0);
   for(let k=0;k<4;k++)out[i*4+k]=m[k]?((px&m[k])>>>sh[k])*255/mx[k]:255}
 }else throw Error('Unsupported DDS pixel format');
 return{w,h,rgba:out,cc:pf&4?cc:bpp+'-bit'}}
function encDDS(rgba,w,h,t){
 const bw=w+3>>2,bh=h+3>>2,bs=t===1?8:16,out=new Uint8Array(128+bw*bh*bs),v=new DataView(out.buffer);
 v.setUint32(0,0x20534444,true);v.setUint32(4,124,true);v.setUint32(8,0x81007,true);v.setUint32(12,h,true);v.setUint32(16,w,true);v.setUint32(20,bw*bh*bs,true);v.setUint32(28,1,true);v.setUint32(76,32,true);v.setUint32(80,4,true);out.set([68,88,84,t===1?49:53],84);v.setUint32(108,0x1000,true);
 const px=new Uint8Array(64),e=(r,g,b)=>(r>>3)<<11|(g>>2)<<5|b>>3;
 for(let by=0;by<bh;by++)for(let bx=0;bx<bw;bx++){
  let n=0;for(let j=0;j<4;j++)for(let i=0;i<4;i++){const s=(Math.min(by*4+j,h-1)*w+Math.min(bx*4+i,w-1))*4;px[n++]=rgba[s];px[n++]=rgba[s+1];px[n++]=rgba[s+2];px[n++]=rgba[s+3]}
  let o=128+(by*bw+bx)*bs;
  if(t===5){let lo=255,hi=0;for(let i=0;i<16;i++){const a=px[i*4+3];if(a<lo)lo=a;if(a>hi)hi=a}
   const pal=[hi,lo];if(hi>lo)for(let k=1;k<7;k++)pal.push(((7-k)*hi+k*lo)/7);else{for(let k=1;k<5;k++)pal.push(((5-k)*hi+k*lo)/5);pal.push(0,255)}
   let L=0,H=0;for(let i=0;i<16;i++){const a=px[i*4+3];let b=0,d=1e9;pal.forEach((p,k)=>{const q=Math.abs(p-a);if(q<d){d=q;b=k}});const s=3*i;
    if(s<32){L|=b<<s;if(s>29)H|=b>>>(32-s)}else H|=b<<(s-32)}
   out[o]=hi;out[o+1]=lo;v.setUint32(o+2,L>>>0,true);v.setUint16(o+6,H&65535,true);o+=8}
  const mn=[255,255,255],mx=[0,0,0];let tr=false;
  for(let i=0;i<16;i++){for(let c=0;c<3;c++){const x=px[i*4+c];if(x<mn[c])mn[c]=x;if(x>mx[c])mx[c]=x}if(t===1&&px[i*4+3]<128)tr=true}
  for(let c=0;c<3;c++){const d=(mx[c]-mn[c])>>4;mn[c]+=d;mx[c]-=d}
  let c0=e(...mx),c1=e(...mn);if(tr?c0>c1:c0<c1)[c0,c1]=[c1,c0];
  const C0=c565(c0),C1=c565(c1),P=tr?[C0,C1,C0.map((x,i)=>(x+C1[i])/2)]:[C0,C1,C0.map((x,i)=>(2*x+C1[i])/3),C0.map((x,i)=>(x+2*C1[i])/3)];
  let bits=0;for(let i=0;i<16;i++){let b=0;if(tr&&px[i*4+3]<128)b=3;else{let d=1e9;P.forEach((p,k)=>{const q=(p[0]-px[i*4])**2+(p[1]-px[i*4+1])**2+(p[2]-px[i*4+2])**2;if(q<d){d=q;b=k}})}bits|=b<<(2*i)}
  v.setUint16(o,c0,true);v.setUint16(o+2,c1,true);v.setUint32(o+4,bits>>>0,true)}
 return new Blob([out])}
async function imgFit(file,w,h){const bm=await createImageBitmap(file),k=Math.min(w/bm.width,h/bm.height),dw=Math.round(bm.width*k),dh=Math.round(bm.height*k),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(bm,(w-dw)>>1,(h-dh)>>1,dw,dh);return{w,h,rgba:x.getImageData(0,0,w,h).data}}
async function imgRGBA(file,w,h){const bm=await createImageBitmap(file);w=w||bm.width;h=h||bm.height;const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(bm,0,0,w,h);return{w,h,rgba:x.getImageData(0,0,w,h).data}}
function draw(cv,d){cv.width=d.w;cv.height=d.h;cv.getContext('2d').putImageData(new ImageData(d.rgba,d.w,d.h),0,0)}
const pngOf=cv=>new Promise(r=>cv.toBlob(r,'image/png'));
/* ---------- PAC (EPK8) ---------- */
function parsePac(u){const v=new DataView(u.buffer);
 if(td.decode(u.subarray(0,4))!=='EPK8')return{err:'Not an EPK8 container (missing "EPK8" header).'};
 const r={size:u.length,ver:v.getUint32(4,true),id:td.decode(u.subarray(0x80c,0x814)).replace(/\0/g,''),ent:[]};
 if(td.decode(u.subarray(0x4000,0x4004))==='PACH')for(let p=0x4014;p+12<=0x4100;p+=12){const id=v.getUint32(p,true),off=v.getUint32(p+4,true),sz=v.getUint32(p+8,true);if(!sz||off<0x4000||off+sz>u.length)break;r.ent.push({id,off,sz})}
 const f=td.decode(u.subarray(Math.max(0,u.length-0x800)));const k=f.indexOf('EOP5');r.foot=k>=0?f.slice(k+4).split('\0')[0]:'';return r}
function hex(u,n=256){let s='';for(let i=0;i<Math.min(n,u.length);i+=16){const r=[...u.subarray(i,i+16)];s+=i.toString(16).padStart(6,'0')+'  '+r.map(b=>b.toString(16).padStart(2,'0')).join(' ').padEnd(48)+' '+r.map(b=>b>31&&b<127?String.fromCharCode(b):'.').join('')+'\n'}return s}
/* ---------- panel ---------- */
const SLOTS=[['ch.pac','Model and gear (PAC)','.pac'],['theme.mp3','Entrance theme','.mp3,audio/mpeg'],['voice.ogg','Announcer voice',''],['movie.bik','Entrance video','.bik'],['render.dds','Render, large','.dds,image/*'],['render_small.dds','Render, small','.dds,image/*']];
const NEW=[['type','superstar'],['id',''],['name',''],['short',''],['base','104'],['style',''],['author',''],['version','1.0'],['made_with','SVR Mod Workshop'],['ratings','70,70,70,70,70,70,70'],['entrance','0'],['announcer',''],['song','theme.mp3'],['voice','voice.ogg'],['movie','movie.bik']];
function panel(root,create){
 root.innerHTML=`${create?'':'<label class="big" tabindex="0"><b>Open a .svrmod file</b><span class="note">Choose the mod you want to change</span><input type="file" class="open" hidden></label>'}
 <div class="body ${create?'':'hide'}">
 <div class="card"><h2>Details</h2><div class="mf"></div><p class="note">These fields are saved as manifest.txt inside the mod.</p></div>
 <div class="card"><h2>Files</h2><div class="files"></div><p class="note">Each attire (outfit) is its own model slot inside ch.pac. Use Open in PAC Studio, then Add attire slot to give a superstar more outfits.</p></div>
 <div class="card"><h2>PAC inspector</h2><div class="pac note">Add a ch.pac file to inspect it.</div></div>
 <div class="card"><h2>Texture converter</h2><p class="note" style="margin:0 0 8px">Choose a .dds to see it and save it as PNG, or choose a PNG/JPG to turn it into a .dds.</p><input type="file" class="cv"><div class="cvo"></div></div>
 <button class="btn pri build">Download .svrmod</button></div>`;
 const q=s=>root.querySelector(s),files={};let mf=create?NEW.map(a=>[...a]):[],pacBuf=null,fname='mod';
 const body=q('.body');
 function mfDraw(){const g=q('.mf');g.innerHTML='';mf.forEach(([k,v],i)=>{const l=document.createElement('label'),inp=document.createElement('input');l.append(k);inp.type='text';inp.value=v;inp.oninput=()=>mf[i][1]=inp.value;l.append(inp);g.append(l)})}
 const names=()=>[...SLOTS.map(s=>s[0]),...Object.keys(files).filter(n=>!SLOTS.some(s=>s[0]===n))];
 function rows(){const el=q('.files');el.innerHTML='';
  for(const n of names()){const s=SLOTS.find(x=>x[0]===n)||[n,'Extra file','*'],f=files[n],r=document.createElement('div');r.className='row';
   r.innerHTML=`<span class="nm"></span><span class="lb"></span><span class="act"><label class="btn">${f?'Replace':'Add'}<input type="file" hidden></label>${f?'<button class="b sv">Save</button>':''}${f&&n==='ch.pac'?'<button class="b ps pri">Open in PAC Studio</button>':''}</span><div class="info"></div>`;
   $(r,'.nm').textContent=n;$(r,'.lb').textContent=s[1]+(f?' · '+fmt(f.blob.size):' · empty');
   $(r,'input').onchange=e=>put(n,e.target.files[0]);if(f){const ps=$(r,'.ps');if(ps)ps.onclick=()=>{const tg=b=>put('ch.pac',b);toStudio(f.blob,root.id,tg)};$(r,'.sv').onclick=()=>save(n,f.blob);info(n,f.blob,$(r,'.info'))}
   el.append(r)}}
 async function put(n,f){if(!f)return;try{let b=f;
  if(/\.dds$/i.test(n)&&!/\.dds$/i.test(f.name)){let w=512,h=512;if(n==='render_small.dds')w=h=256;const old=files[n];
   if(old){const d=new DataView(await old.blob.slice(0,20).arrayBuffer());h=d.getUint32(12,true);w=d.getUint32(16,true)}
